[project]
name = "aflux-media"
version = "0.1.1"
description = "aflux-media"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "DayNice", email = "76981513+DayNice@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=17.1.0",
    "cyclopts>=4.18.0",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[project.scripts]
aflux-media = "aflux_media.cli:app"

[project.urls]
Repository = "https://github.com/DayNice/aflux-media"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    {"include-group" = "notebook"},
    {"include-group" = "test"},
]
notebook = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "tqdm>=4.67.3",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 120
extend-include = ["*.ipynb"]

[tool.ruff.lint]
extend-select = ["I", "RUF022"]

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
source_pkgs = ["aflux_media"]
branch = true
parallel = true

[tool.coverage.paths]
aflux_media = ["src/aflux_media", "*/aflux-media/src/aflux_media"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "^\\s*@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "def __repr__",
    "def __str__",
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=xml"
